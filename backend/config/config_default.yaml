config_version: 1
# Default configuration for the application
# You can override these settings by creating a config.yaml file in the same directory
# Do not edit this file directly, as it may be overwritten during updates
"mongodb_url": "mongodb://localhost:27017"
"mongo_database_name": "my_database"
"mongo_timeout_ms": 5000
"mongo_transaction_mode": "auto"

# LLM 大模型配置
# 每个 provider 条目的 key 是用户自定义的别名，type 指定接口模式（openai / gemini / claude / deepseek）
# 同一个 type 可以定义多个不同别名的配置，方便在不同场景使用不同模型
# 每个 provider 可选配置生成参数默认值（temperature / top_p / max_tokens / system_prompt 等），
# 请求级别的参数会覆盖 provider 级别的默认值
# api_mode: auto 官方地址用 Responses（OpenAI/DeepSeek）或 Interactions（Gemini）。
# 自定义地址默认保留 Chat Completions / Generate Content，可显式改用新版接口。
# reasoning_effort: low / medium / high 等；可用等级由具体模型决定。
# thinking_mode: DeepSeek enabled/disabled，Claude adaptive/between_tools/disabled。
# thinking_budget: 旧版 Gemini/Claude 的预算，不与新版等级混用。
# reasoning_mode: standard/pro 与 verbosity: low/medium/high 仅用于 OpenAI。
# max_tokens 包含思考消耗；新版接口会转换成 max_output_tokens。
# Claude 使用 output_config.format；旧模型可设 structured_output_mode: tool_call。
llm:
  default_provider: openai_gpt4o_mini
  format_review_provider: openai_gpt5_4_nano
  providers:
    openai_gpt4o_mini:
      type: openai
      base_url: "https://api.openai.com"
      api_key: ""
      default_model: "gpt-4o-mini"
      enabled: false
      timeout_seconds: 60
      max_retries: 2
      max_concurrency: 5
      use_system_proxy: false
      supports_streaming: true
      supports_json_schema: true
      supports_function_calling: true
      # 生成参数默认值（可选，不设置则由模型自行决定）
      # temperature: 0.7
      # top_p: 0.9
      # max_tokens: 4096
      # system_prompt: ""
      # presence_penalty: 0.0
      # frequency_penalty: 0.0
    deepseek_chat:
      type: deepseek
      base_url: "https://api.deepseek.com"
      api_key: ""
      default_model: "deepseek-flash"
      enabled: false
      timeout_seconds: 60
      max_retries: 2
      max_concurrency: 5
      use_system_proxy: false
      supports_streaming: true
      # Responses 支持原生 JSON Schema；旧 Chat Completions 仅支持 JSON Output。
      supports_json_schema: true
      supports_function_calling: true
    gemini_flash:
      type: gemini
      base_url: ""
      api_key: ""
      default_model: "gemini-3.8-flash"
      enabled: false
      timeout_seconds: 60
      max_retries: 2
      max_concurrency: 5
      use_system_proxy: false
      supports_streaming: true
      supports_json_schema: true
      supports_function_calling: true
    claude_sonnet:
      type: claude
      base_url: ""
      api_key: ""
      default_model: "claude-sonnet-5-5"
      enabled: false
      timeout_seconds: 60
      max_retries: 2
      max_concurrency: 5
      use_system_proxy: false
      supports_streaming: true
      supports_json_schema: true
      supports_function_calling: true
